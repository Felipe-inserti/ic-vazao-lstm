# Períodos de vazão tratados como FALTA (medição inconsistente). Ver docs/decisoes.md.
# Critério: cota mínima mensal na estiagem fora do patamar histórico do posto,
# sem chuva que explique, e/ou cota abaixo da faixa de validade da curva de descarga.
ivr:
  - {inicio: 2010-01-01, fim: 2010-12-31, motivo: "cota mínima 193-202 cm em jun-ago (normal 110-160) com chuva normal; simultâneo a GAP e FSB"}
  - {inicio: 2016-01-15, fim: 2016-12-31, motivo: "salto de ~70 cm na cota mínima (182-237) com chuva abaixo da média; coincide com a curva 04 (15/01/2016)"}
gap:
  - {inicio: 2009-12-01, fim: 2011-10-31, motivo: "cota mínima 179-235 cm por 23 meses (normal 97-153), incl. estiagem; queda abrupta de 69 cm out->nov/2011 no início das chuvas"}
fsb:
  - {inicio: 2010-01-01, fim: 2010-07-31, motivo: "cota mínima 158-209 cm em jun-ago (normal 105-130); simultâneo a IVR e GAP"}
  - {inicio: 2016-11-01, fim: 2017-01-31, motivo: "cota 63-79 cm, abaixo da faixa da curva (>= 70 cm), em período chuvoso; vazão ~0"}
